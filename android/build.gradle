allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Some older plugin dependencies (e.g. google_api_headers) predate AGP 8's
// mandatory namespace and only declare a manifest `package` attribute.
// Backfill their namespace from that so AGP 8 can still build them.
// They also don't pin a Kotlin JVM target, so it falls back to whatever JDK
// is running Gradle (21 here), clashing with their Java 8 compileOptions.
// Force both to Java 17 so every subproject agrees.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
